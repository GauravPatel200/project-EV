<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | E-Fill</title>

    <link rel="stylesheet" href="css/login.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>⚡ E-Fill</h1>

        <h2>Welcome Back</h2>

        <p>

            Login to continue booking EV charging stations.

        </p>

        <img src="assets/images/login.png">

    </div>

    <div class="right">

        <form id="loginForm">

            <h2>Login</h2>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input

                    type="email"

                    id="email"

                    placeholder="Email"

                    required

                >

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input

                    type="password"

                    id="password"

                    placeholder="Password"

                    required

                >

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button type="submit">

                Login

            </button>

            <p id="message"></p>

            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">

                    Signup

                </a>

            </div>

        </form>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
