<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup | E-Fill</title>

    <link rel="stylesheet"
          href="css/signup.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>⚡ E-Fill</h1>

        <h2>Create Account</h2>

        <p>

            Join India's Smart EV Charging Platform.

        </p>

    </div>

    <div class="right">

        <form id="signupForm">

            <h2>Signup</h2>

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

            </div>

            <button type="submit">

                Create Account

            </button>

            <p id="message"></p>

            <div class="login-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </form>

    </div>

</div>

<script src="js/signup.js"></script>

</body>

</html>
